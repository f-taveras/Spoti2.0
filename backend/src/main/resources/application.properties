spring.application.name=backend
# Load application-local.properties for dev (it's gitignored — real secrets live there)
spring.profiles.active=local

# ── H2 In-Memory Database ──────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:spotidb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── H2 Console (dev only) ──────────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JWT ────────────────────────────────────────────────────────────────────────
# DEV:  set JWT_SECRET env var, or override in application-local.properties (gitignored)
# PROD: inject from AWS Secrets Manager / GCP Secret Manager / Vault
jwt.secret=${JWT_SECRET:spoti2-super-secret-key-change-in-production-abc123}
jwt.expiration=86400000

# ── Spotify OAuth2 ─────────────────────────────────────────────────────────────
# DEV:  set SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET as env vars
#       OR create backend/application-local.properties (gitignored) with the real values
# PROD: inject from your cloud secret manager — see .env.example for the variable names
spring.security.oauth2.client.registration.spotify.client-id=${SPOTIFY_CLIENT_ID:YOUR_SPOTIFY_CLIENT_ID_HERE}
spring.security.oauth2.client.registration.spotify.client-secret=${SPOTIFY_CLIENT_SECRET:YOUR_SPOTIFY_CLIENT_SECRET_HERE}
spring.security.oauth2.client.registration.spotify.scope=user-read-email,user-read-private,playlist-read-private,playlist-read-collaborative,streaming,user-read-playback-state,user-modify-playback-state
spring.security.oauth2.client.registration.spotify.redirect-uri=https://spoti20-production.up.railway.app/login/oauth2/code/spotify
spring.security.oauth2.client.registration.spotify.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.spotify.client-name=Spotify
spring.security.oauth2.client.registration.spotify.client-authentication-method=client_secret_basic

spring.security.oauth2.client.provider.spotify.authorization-uri=https://accounts.spotify.com/authorize
spring.security.oauth2.client.provider.spotify.token-uri=https://accounts.spotify.com/api/token
spring.security.oauth2.client.provider.spotify.user-info-uri=https://api.spotify.com/v1/me
spring.security.oauth2.client.provider.spotify.user-name-attribute=id

# ── Frontend URL (used in CORS + OAuth success redirect) ──────────────────────
# Override in application-prod.properties via FRONTEND_URL env var
app.frontend-url=http://localhost:5173
